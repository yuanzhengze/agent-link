services:
  api:
    build: .
    ports:
      - "443:8080"
    environment:
      - REDIS_ADDR=redis:6379
      # Public HTTPS origin (sets cookie scope). Terminate TLS at your proxy.
      - PUBLIC_URL=${PUBLIC_URL:-https://cowork.example}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - DATA_DIR=/data/projects
    volumes:
      - project_data:/data/projects
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  project_data:
